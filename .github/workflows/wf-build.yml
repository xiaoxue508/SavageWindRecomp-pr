name: wf build only
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            zip
            curl
            tar
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            build/deps-win
            build/zig
          key: sw-deps-${{ runner.os }}-${{ hashFiles('tools/build_deps_windows.sh','tools/fetch_zig.sh','tools/zig_slim.sh') }}
      - name: Build
        shell: msys2 {0}
        run: make gen-helper GEN_PY="$(command -v python)"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ github.run_number }}
          path: build/dist/*.zip
          if-no-files-found: error
          retention-days: 30
